# Pubblicazione dell'immagine del client su Docker Hub, a ogni tag v*.
#
# Richiede due secret nel repository:
#   DOCKERHUB_USERNAME   l'utente Docker Hub
#   DOCKERHUB_TOKEN      un access token, non la password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da assegnare all'immagine"
        required: true
        default: "latest"

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Serve a costruire per arm64 su un runner x86: senza, la build per
      # quella piattaforma non parte nemmeno.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/visioncaption-client:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/visioncaption-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
